<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive Valentine's Day envelope with animated letter">
    <title>Envelope-VD | Happy Valentine's Day</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(to bottom right, #f5f3f4, #e8e3e6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1879f;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a67083;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { 
                transform: translateY(0); 
            }
            50% { 
                transform: translateY(-15px); 
            }
        }
        
        @keyframes shadow-float {
            0%, 100% { 
                transform: scale(1); 
                opacity: 0.5; 
            }
            50% { 
                transform: scale(0.9); 
                opacity: 0.3; 
            }
        }
        
        @keyframes sparkle {
            0%, 100% { 
                opacity: 0; 
                transform: scale(0) rotate(0deg); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1) rotate(180deg); 
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Main Container */
        .main-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Envelope Shadow */
        .envelope-shadow {
            position: absolute;
            bottom: -15px;
            width: 450px;
            height: 40px;
            background: black;
            opacity: 0.5;
            border-radius: 50%;
            filter: blur(15px);
            animation: shadow-float 3s infinite;
        }

        /* Envelope Container - WIDER SIZE */
        .envelope-container {
            position: relative;
            width: 600px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            animation: float 3s infinite;
        }

        /* Envelope Bottom - SOFT ROSE/MAUVE GRADIENT */
        .envelope-bottom {
            background: linear-gradient(135deg, #d4a5b8 0%, #c1879f 50%, #b57690 100%);
            width: 100%;
            height: 300px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-bottom: 2px solid rgba(107, 114, 128, 0.3);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Letter - WIDER SIZE WITH SCROLLABLE CONTENT */
        .letter {
            position: absolute;
            background: linear-gradient(to bottom right, #fefbfc, #fdf7f9);
            width: 540px;
            height: 550px;
            padding: 32px;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            border: 1px solid #d4a5b8;
            overflow-y: auto;
        }

        .letter-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .letter-title {
            color: #7d5260;
            font-weight: bold;
            font-size: 32px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .letter-subtitle {
            color: #8b7584;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .letter-gift {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            width: 300px;
            height: 300px;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }

        .letter-gift:hover {
            transform: scale(1.05);
        }

        .letter-gift:focus {
            outline: 2px solid #c1879f;
            outline-offset: 2px;
        }

        /* Letter Animation States */
        .letter.bounce-1 {
            transform: translateY(-270px);
            opacity: 1;
            visibility: visible;
        }

        .letter.bounce-2 {
            transform: translateY(135px);
        }

        .letter.bounce-3 {
            transform: translateY(-34px);
        }

        .letter.visible {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* Envelope Flap - SOFT ROSE/MAUVE GRADIENT */
        .envelope-flap {
            position: absolute;
            background: linear-gradient(135deg, #a67083 0%, #b57690 50%, #c1879f 100%);
            width: 100%;
            height: 150px;
            top: 0;
            transform-origin: bottom;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-bottom: 1px solid #d4a5b8;
        }

        .envelope-flap.open {
            transform: rotateX(180deg);
        }

        /* Open Button - SOFT ROSE THEME */
        .open-button {
            background: linear-gradient(to right, #c1879f, #a67083);
            color: white;
            font-weight: bold;
            padding: 16px 48px;
            border-radius: 9999px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            font-size: 24px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .open-button:hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(1.05);
        }

        .open-button:active {
            transform: scale(0.95);
        }

        .open-button:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(193, 135, 159, 0.5);
        }

        /* Instructions */
        .instructions {
            margin-top: 40px;
            color: #8b7584;
            font-size: 18px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        /* Decorative Hearts */
        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            animation: sparkle 3s infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 15px;
            height: 24px;
            background: #c1879f;
            border-radius: 15px 15px 0 0;
        }

        .heart::before {
            left: 15px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        .heart-1 { top: 10%; left: 15%; animation-delay: 0s; }
        .heart-2 { top: 20%; right: 20%; animation-delay: 1s; }
        .heart-3 { bottom: 15%; left: 25%; animation-delay: 2s; }
        .heart-4 { bottom: 25%; right: 15%; animation-delay: 1.5s; }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            .envelope-container {
                width: 320px;
                height: 288px;
            }

            .envelope-bottom {
                height: 208px;
            }

            .letter {
                width: 288px;
                height: 400px;
                padding: 24px;
            }

            .letter-title {
                font-size: 24px;
            }

            .letter-gift {
                width: 200px;
                height: 200px;
            }

            .envelope-flap {
                height: 112px;
            }

            .open-button {
                padding: 12px 32px;
                font-size: 18px;
            }

            .instructions {
                font-size: 14px;
            }

            .envelope-shadow {
                width: 250px;
                height: 30px;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .envelope-container {
                width: 480px;
                height: 360px;
            }

            .envelope-bottom {
                height: 260px;
            }

            .letter {
                width: 432px;
                height: 480px;
            }

            .letter-gift {
                width: 250px;
                height: 250px;
            }

            .envelope-flap {
                height: 140px;
            }

            .envelope-shadow {
                width: 380px;
            }
        }
    </style>
</head>
<body>
    
    <!-- Decorative Background Hearts -->
    <div class="heart heart-1"></div>
    <div class="heart heart-2"></div>
    <div class="heart heart-3"></div>
    <div class="heart heart-4"></div>

    <!-- Main Container -->
    <main class="main-container" role="main">
        <!-- Envelope Shadow -->
        <div class="envelope-shadow" aria-hidden="true"></div>

        <!-- Envelope Container -->
        <div class="envelope-container">
            <!-- Envelope Bottom -->
            <div class="envelope-bottom" aria-label="Envelope base"></div>

            <!-- Letter Content -->
            <article id="letter" 
                class="letter"
                aria-live="polite"
                aria-hidden="true">
                <div class="letter-content">
                    <h1 class="letter-title">
                        Happy Valentine's Day!
                    </h1>
                    <!-- Gift (GIF) -->
                    <img id="gift" 
                        src="mochi-cat.gif" 
                        alt="Animated Valentine's gift - Click to close" 
                        class="letter-gift"
                        loading="lazy"
                        tabindex="0"
                        role="button"
                        aria-label="Close envelope">
                </div>
            </article>

            <!-- Envelope Flap -->
            <div id="flap" 
                class="envelope-flap"
                aria-label="Envelope flap">
                
                <!-- Open Button -->
                <button id="open" 
                    class="open-button"
                    aria-label="Open Valentine's envelope"
                    type="button">
                    Open
                </button>
            </div>
        </div>

    </main>

    <script>
        /**
         * Valentine's Envelope Interactive Animation
         * Optimized and enhanced version
         */

        // DOM Elements Cache
        const elements = {
            flap: document.getElementById('flap'),
            letter: document.getElementById('letter'),
            button: document.getElementById('open'),
            gift: document.getElementById('gift'),
            instructions: document.getElementById('instructions')
        };

        // State management
        const state = {
            isOpen: false,
            isAnimating: false
        };

        // Animation timing constants
        const TIMING = {
            FLAP_ROTATE: 700,
            LETTER_BOUNCE_1: 500,
            LETTER_BOUNCE_2: 900,
            LETTER_BOUNCE_3: 1200,
            CLOSE_STEP_1: 150,
            CLOSE_STEP_2: 300,
            CLOSE_COMPLETE: 500
        };

        /**
         * Initialize event listeners
         */
        function init() {
            // Open button click handler
            elements.button.addEventListener('click', handleOpenClick);
            
            // Gift click handler
            elements.gift.addEventListener('click', handleGiftClick);
            
            // Keyboard accessibility for gift
            elements.gift.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleGiftClick();
                }
            });

            // Keyboard accessibility for button
            elements.button.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleOpenClick();
                }
            });
        }

        /**
         * Handle open button click
         */
        function handleOpenClick() {
            if (!state.isOpen && !state.isAnimating) {
                openLetter();
            }
        }

        /**
         * Handle gift click
         */
        function handleGiftClick() {
            if (state.isOpen && !state.isAnimating) {
                closeLetterFast();
            }
        }

        /**
         * Open the letter with smooth bounce animation
         */
        function openLetter() {
            state.isAnimating = true;
            state.isOpen = true;

            // Update ARIA attributes
            elements.letter.setAttribute('aria-hidden', 'false');
            elements.button.setAttribute('aria-expanded', 'true');
            
            // Rotate flap
            elements.flap.classList.add('open');
            
            // Start bounce animation
            elements.letter.classList.add('bounce-1');

            // Bounce animation sequence
            setTimeout(() => {
                elements.letter.classList.remove('bounce-1');
                elements.letter.classList.add('bounce-2');
            }, TIMING.LETTER_BOUNCE_1);

            setTimeout(() => {
                elements.letter.classList.remove('bounce-2');
                elements.letter.classList.add('bounce-3');
            }, TIMING.LETTER_BOUNCE_2);

            setTimeout(() => {
                elements.letter.classList.remove('bounce-3');
                elements.letter.classList.add('visible');
                state.isAnimating = false;
                
                // Update button
                elements.button.innerHTML = '';
                elements.button.setAttribute('aria-label', 'Envelope opened');
                
                // Update instructions
                if (elements.instructions) {
                    elements.instructions.textContent = 'Click the gift to close the envelope';
                }
            }, TIMING.LETTER_BOUNCE_3);
        }

        /**
         * Close the letter quickly with reverse animation
         */
        function closeLetterFast() {
            state.isAnimating = true;
            state.isOpen = false;

            // Update ARIA attributes
            elements.letter.setAttribute('aria-hidden', 'true');
            elements.button.setAttribute('aria-expanded', 'false');

            // Start reverse animation
            elements.letter.classList.remove('visible');
            elements.letter.classList.add('bounce-3');

            // Reverse bounce sequence
            setTimeout(() => {
                elements.letter.classList.remove('bounce-3');
                elements.letter.classList.add('bounce-2');
            }, TIMING.CLOSE_STEP_1);

            setTimeout(() => {
                elements.letter.classList.remove('bounce-2');
                // Reset to initial hidden state
                elements.letter.style.transform = 'translateY(100%)';
                elements.letter.style.opacity = '0';
                elements.letter.style.visibility = 'hidden';
            }, TIMING.CLOSE_STEP_2);

            // Complete close animation
            setTimeout(() => {
                elements.flap.classList.remove('open');
                elements.button.innerHTML = 'Open';
                elements.button.setAttribute('aria-label', 'Open Valentine\'s envelope');
                state.isAnimating = false;
                
                // Clear inline styles
                elements.letter.style.transform = '';
                elements.letter.style.opacity = '';
                elements.letter.style.visibility = '';
                
                // Update instructions
                if (elements.instructions) {
                    elements.instructions.textContent = 'Click the button to open your Valentine\'s surprise!';
                }
            }, TIMING.CLOSE_COMPLETE);
        }

        /**
         * Optional: Add confetti effect
         */
        function createConfetti() {
            const colors = ['#c1879f', '#d4a5b8', '#a67083', '#b57690'];
            const confettiCount = 30;
            
            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.style.cssText = `
                    position: fixed;
                    width: 10px;
                    height: 10px;
                    background: ${colors[Math.floor(Math.random() * colors.length)]};
                    left: ${Math.random() * 100}vw;
                    top: -20px;
                    opacity: ${Math.random()};
                    transform: rotate(${Math.random() * 360}deg);
                    pointer-events: none;
                    z-index: 1000;
                    border-radius: 2px;
                `;
                
                document.body.appendChild(confetti);
                
                // Animate falling
                const animation = confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                });
                
                // Remove after animation
                animation.onfinish = () => confetti.remove();
            }
        }

        // Optional: Uncomment to enable confetti on open
        // elements.button.addEventListener('click', () => {
        //     if (!state.isOpen) {
        //         setTimeout(createConfetti, 500);
        //     }
        // });

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
